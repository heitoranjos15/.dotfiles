onboarding = false
[theme]
name = "gruvbox"
auto_switch = false
[keys]
prefix = "ctrl+a"
navigate_workspace_up = "k"
navigate_workspace_down = "j"

[[keys.command]]
key = "prefix+h"
type = "shell"
command = "~/.config/herdr/switch-tab.sh 1"
description = "switch to tab 1"

[[keys.command]]
key = "prefix+t"
type = "shell"
command = "~/.config/herdr/switch-tab.sh 2"
description = "switch to tab 2"

[[keys.command]]
key = "prefix+n"
type = "shell"
command = "~/.config/herdr/switch-tab.sh 3"
description = "switch to tab 3"

[[keys.command]]
key = "prefix+s"
type = "shell"
command = "~/.config/herdr/switch-tab.sh 4"
description = "switch to tab 4"

[ui]
agent_panel_sort = "spaces"
